name: 'Publish bundled npm package'
description: >
  Stages a production-only, bundleDependencies-enabled copy of the current npm package and
  publishes it to the npm registry - replacing the pinning guarantee npm-shrinkwrap.json used
  to provide before npm v12 removed shrinkwrap support entirely. Must run after the package
  has already been built (its "files" entries need to exist on disk) and after any version
  bump, from the repo root.
inputs:
  unbundled-packages:
    description: >
      Space-separated dependency names to exclude from bundling (wherever declared -
      dependencies or optionalDependencies), left for the consumer's own npm install to fetch
      normally instead - every dependency is exact-pinned regardless. Use for anything
      bundling would be wrong for - most commonly native/platform-specific packages, where
      bundling would ship whatever binary the CI runner resolved for its own OS/arch and break
      every other platform.
    required: false
    default: ''
  native-platforms:
    description: >
      Space-separated "os-cpu[-libc]" targets (e.g. "linux-x64 linux-arm64 darwin-arm64
      win32-x64") to additionally embed a native binary for, on top of whatever the
      CI runner itself resolved. Applies to every platform-locked optional dependency found
      anywhere in the resolved tree (any package whose own package.json restricts installation
      via "os"/"cpu" - npm's own convention for per-platform native binary packages, e.g. sharp's
      `@img/sharp-*` or koffi's `@koromix/koffi-*`), not just ones named in unbundled-packages.
      Leave empty (the default) to bundle only the CI runner's own platform, relying on the
      consumer's own npm install to fill in the rest.

      The opposite pattern - a package that ships every platform's binary bundled together in one
      `prebuilds/` directory (`node-gyp-build`/`prebuildify`'s own convention, e.g. `bare-fs`) -
      ships every platform unconditionally, so whenever this input is non-empty, any
      `prebuilds/<platform>` subdirectory not matching the CI runner's own platform or a
      configured target here also gets deleted before bundling, trimming otherwise-unavoidable
      dead weight (e.g. iOS/Android prebuilds pulled in by an unrelated dependency).
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Stage bundled npm package
      id: stage
      shell: bash
      env:
        UNBUNDLED_PACKAGES: ${{ inputs.unbundled-packages }}
        NATIVE_PLATFORMS: ${{ inputs.native-platforms }}
        BUNDLE_FILENAME: 'package.tgz'
      run: |
        node "${{ github.action_path }}/prepare-npm-bundle.mjs"
        echo "bundle-filename=$BUNDLE_FILENAME" >> "$GITHUB_OUTPUT"
    - name: Publish bundled package
      shell: bash
      working-directory: .release-pkg
      run: npm publish --ignore-scripts "${{ steps.stage.outputs.bundle-filename }}"
