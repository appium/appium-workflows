name: 'Publish bundled npm package'
description: >
  Stages a production-only, bundleDependencies-enabled copy of the current npm package and
  publishes it to the npm registry - replacing the pinning guarantee npm-shrinkwrap.json used
  to provide before npm v12 removed shrinkwrap support entirely. Must run after the package
  has already been built (its "files" entries need to exist on disk) and after any version
  bump, from the repo root.
inputs:
  unbundled-packages:
    description: >
      Space-separated dependency names to exclude from bundling (wherever declared -
      dependencies or optionalDependencies), left for the consumer's own npm install to fetch
      normally instead - every dependency is exact-pinned regardless. Use for anything
      bundling would be wrong for - most commonly native/platform-specific packages, where
      bundling would ship whatever binary the CI runner resolved for its own OS/arch and break
      every other platform.
    required: false
    default: ''
  bundle-filename:
    description: >
      Filename the staged bundle tarball is written to inside `.release-pkg`, and published
      from.
    required: false
    default: 'package.tgz'
runs:
  using: 'composite'
  steps:
    - name: Stage bundled npm package
      shell: bash
      env:
        UNBUNDLED_PACKAGES: ${{ inputs.unbundled-packages }}
        BUNDLE_FILENAME: ${{ inputs.bundle-filename }}
      run: node "${{ github.action_path }}/prepare-npm-bundle.mjs"
    - name: Publish bundled package
      shell: bash
      working-directory: .release-pkg
      env:
        BUNDLE_FILENAME: ${{ inputs.bundle-filename }}
      run: npm publish --ignore-scripts "$BUNDLE_FILENAME"
