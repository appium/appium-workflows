name: Conventional Commits

on:
  workflow_call:
    inputs:
      config-preset:
        description: 'Deprecated compatibility input. PR titles are validated against the Conventional Commits spec.'
        required: false
        type: string
        default: 'angular'

jobs:
  conventional-pr-check:
    name: https://www.conventionalcommits.org
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
