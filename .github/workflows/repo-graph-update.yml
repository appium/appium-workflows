name: Repo graph update

on:
  workflow_call:
    inputs:
      repo-root:
        description: 'Repository root to run the graph generation from.'
        required: false
        type: string
        default: '.'
      watch-paths:
        description: 'Newline-delimited glob patterns, relative to the repository root, that should trigger the graph update.'
        required: false
        type: string
        default: |
          lib/**/*.ts
      branch-name:
        description: 'Branch to create or update for the graph pull request.'
        required: false
        type: string
        default: 'chore/update-repo-graph'
      pr-title:
        description: 'Title for the pull request that contains repo graph updates.'
        required: false
        type: string
        default: 'chore: update repo graph'
      pr-body:
        description: 'Body for the pull request that contains repo graph updates.'
        required: false
        type: string
        default: 'Automated repo graph refresh generated from source changes.'

jobs:
  update-repo-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.repo-root }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Determine the base revision
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse --verify "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
              echo "base_ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
              echo "base_sha=origin/$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            else
              echo "base_ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
              echo "base_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect relevant changes
        id: changes
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          HEAD_SHA: ${{ steps.base.outputs.head_sha }}
          WATCH_PATHS: ${{ inputs.watch-paths }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import fnmatch
          import os
          import pathlib
          import subprocess

          base_sha = os.environ["BASE_SHA"]
          head_sha = os.environ["HEAD_SHA"]
          watch_paths = [line.strip() for line in os.environ.get("WATCH_PATHS", "").splitlines() if line.strip()]
          if not watch_paths:
              watch_paths = ["**/*"]

          result = subprocess.run(
              ["git", "diff", "--name-only", base_sha, head_sha],
              capture_output=True,
              text=True,
              check=True,
          )
          changed_files = [line for line in result.stdout.splitlines() if line]

          matched = False
          for path in changed_files:
              normalized = path.replace(os.sep, "/")
              if any(
                  fnmatch.fnmatch(normalized, pattern) or pathlib.PurePosixPath(normalized).match(pattern)
                  for pattern in watch_paths
              ):
                  matched = True
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"changed={'true' if matched else 'false'}\n")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Generate repo graph
        if: ${{ steps.changes.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          uvx --from mcp-repo-graph repo-graph-init --repo .

      - name: Determine whether graph files changed
        if: ${{ steps.changes.outputs.changed == 'true' }}
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- .ai/repo-graph; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: ${{ steps.changes.outputs.changed == 'true' && steps.diff.outputs.updated == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.branch-name }}
          base: ${{ steps.base.outputs.base_ref }}
          commit-message: ${{ inputs.pr-title }}
          title: ${{ inputs.pr-title }}
          body: ${{ inputs.pr-body }}
          add-paths: .ai/repo-graph
