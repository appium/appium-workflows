name: Repo graph update

on:
  workflow_call:
    inputs:
      repo-root:
        description: 'Repository root to run the graph generation from.'
        required: false
        type: string
        default: '.'
      branch-name:
        description: 'Branch to create or update for the graph pull request.'
        required: false
        type: string
        default: 'chore/update-repo-graph'
      pr-title:
        description: 'Title for the pull request that contains repo graph updates.'
        required: false
        type: string
        default: 'chore: update repo graph'
      pr-body:
        description: 'Body for the pull request that contains repo graph updates.'
        required: false
        type: string
        default: 'Automated repo graph refresh generated from source changes.'

jobs:
  update-repo-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.repo-root }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Determine the base revision
        id: base
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse --verify "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
              echo "base_ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
              echo "base_sha=origin/$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            else
              echo "base_ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
              echo "base_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Generate repo graph
        run: |
          set -euo pipefail
          uvx --from mcp-repo-graph repo-graph-init --repo .

      - name: Determine whether graph files changed
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- .ai/repo-graph; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: ${{ steps.diff.outputs.updated == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.branch-name }}
          base: ${{ steps.base.outputs.base_ref }}
          commit-message: ${{ inputs.pr-title }}
          title: ${{ inputs.pr-title }}
          body: ${{ inputs.pr-body }}
          add-paths: .ai/repo-graph
